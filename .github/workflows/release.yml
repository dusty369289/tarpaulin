name: Release

# Builds every platform, publishes a GitHub release and updates the latest.json manifest that the
# in-app updater reads. Start it either way (after `pnpm release:version 0.2.0` is merged):
#   - push a tag like v0.2.0 on main, or
#   - Actions › Release › Run workflow on main with version 0.2.0, which creates the tag itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (must match package.json, Cargo.toml, tauri.conf.json)
        required: true
        type: string

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  check:
    name: Check version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Only release commits that are on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG ($GITHUB_SHA) is not on main"; exit 1; }
      # Tests aren't rerun here: main only takes commits that passed CI. The version check needs
      # only Node, so nothing is installed and the builds start sooner.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Plain Node: no pnpm here, so don't look for its cache.
          package-manager-cache: false
      - run: node scripts/check-version.ts "$TAG"
      # A run started by hand tags the commit it built. (A tag pushed with the workflow's token
      # doesn't start another run, so this run does the building.)
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" ] || { echo "::error::$TAG already exists on another commit"; exit 1; }
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  build:
    needs: check
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            args: ''
            rust-targets: ''
          # Cross-compiled on the x64 runner; WiX (MSI) has no arm64 support, so NSIS only.
          - name: Windows (arm64)
            os: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rust-targets: aarch64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: Linux (arm64)
            os: ubuntu-22.04-arm
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tauri system packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # The runner's Microsoft apt source sometimes returns 403 and breaks apt-get update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft*.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev patchelf
      # Real-time scanning of every file cargo writes is a large share of a Windows build. The
      # runner is a throwaway VM that only ever runs this job, so there's nothing to protect.
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        # Only a speed-up: never let it fail a release.
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # One cache per platform/target so the matrix jobs don't evict each other.
          key: ${{ matrix.os }}-${{ matrix.rust-targets }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Tarpaulin ${{ env.TAG }}
          releaseBody: |
            Download the installer for your platform below. Existing installs update themselves
            (Settings → Updates, or the banner that appears when a new version is out).

            The builds are not code-signed yet, so macOS and Windows will warn the first time:
            on macOS right-click the app and choose Open; on Windows choose "More info → Run anyway".
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
