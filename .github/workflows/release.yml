name: Release

# Builds every platform into a draft GitHub release, with the latest.json manifest that the in-app
# updater reads, and publishes it only when every platform built: until then installed apps keep
# seeing the previous release. Start it either way (after `pnpm release:version 0.2.0` is merged):
#   - push a tag like v0.2.0 on main, or
#   - Actions › Release › Run workflow on main with version 0.2.0, which creates the tag itself.
# A failed platform leaves the draft in place: re-run the failed jobs and it publishes after.
# release-cache.yml keeps the Rust caches these builds restore warm; keep the two matrices in step.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (must match package.json, Cargo.toml, tauri.conf.json)
        required: true
        type: string

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  RELEASE_BODY: |
    Download the installer for your platform below. Existing installs update themselves
    (Settings → Updates, or the banner that appears when a new version is out).

    The builds are not code-signed yet, so macOS and Windows will warn the first time:
    on macOS right-click the app and choose Open; on Windows choose "More info → Run anyway".

permissions:
  contents: write

jobs:
  check:
    name: Check version matches tag
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Only release commits that are on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG ($GITHUB_SHA) is not on main"; exit 1; }
      # Tests aren't rerun here: main only takes commits that passed CI. The version check needs
      # only Node, so nothing is installed and the builds start sooner.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Plain Node: no pnpm here, so don't look for its cache.
          package-manager-cache: false
      - run: node scripts/check-version.ts "$TAG"
      # A run started by hand tags the commit it built. (A tag pushed with the workflow's token
      # doesn't start another run, so this run does the building.)
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" ] || { echo "::error::$TAG already exists on another commit"; exit 1; }
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      # One draft for the whole matrix, made before any build starts, so parallel builds can't
      # each create their own. A re-run finds the draft it made last time.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          if [ -n "$found" ]; then
            # The first line, should an earlier run have left two.
            read -r id draft <<< "$found"
            [ "$draft" = true ] || { echo "::error::$TAG is already published"; exit 1; }
            echo "Reusing draft release $id"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" \
              -f name="Tarpaulin $TAG" -f body="$RELEASE_BODY" -F draft=true -F prerelease=false \
              --jq .id)
            echo "Created draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            args: ''
            rust-targets: ''
          # Cross-compiled on the x64 runner; WiX (MSI) has no arm64 support, so NSIS only.
          - name: Windows (arm64)
            os: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rust-targets: aarch64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: Linux (arm64)
            os: ubuntu-22.04-arm
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tauri system packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # The runner's Microsoft apt source sometimes returns 403 and breaks apt-get update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft*.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev patchelf
      # Real-time scanning of every file cargo writes is a large share of a Windows build. The
      # runner is a throwaway VM that only ever runs this job, so there's nothing to protect.
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        # Only a speed-up: never let it fail a release.
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # One cache per platform/target so the matrix jobs don't evict each other. The same key
          # as release-cache.yml, whose runs on main are what a tag's run can restore.
          shared-key: release-${{ matrix.os }}-${{ matrix.rust-targets }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Uploads to the draft made above. The tag name makes latest.json link to the tag's
          # download URLs rather than the draft's temporary ones.
          releaseId: ${{ needs.check.outputs.release-id }}
          tagName: ${{ env.TAG }}
          # The updater shows this as the release notes.
          releaseBody: ${{ env.RELEASE_BODY }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.check.outputs.release-id }}
    steps:
      # Each build adds its platform to latest.json by reading it and uploading it again, so two
      # builds finishing together can drop one. Check before anyone's updater sees it.
      - name: Check latest.json lists every platform
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset" ] || { echo "::error::the draft release has no latest.json"; exit 1; }
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          jq '{version, platforms: (.platforms | keys)}' latest.json
          missing=$(jq -r '["darwin-aarch64", "darwin-x86_64", "windows-x86_64", "windows-aarch64",
            "linux-x86_64", "linux-aarch64"] - (.platforms | keys) | join(", ")' latest.json)
          if [ -n "$missing" ]; then
            echo "::error::latest.json is missing $missing. Re-run that platform's build job: it uploads its files and latest.json entry again, and this job runs after it."
            exit 1
          fi
          jq -e --arg v "${TAG#v}" '.version == $v' latest.json > /dev/null ||
            { echo "::error::latest.json is not for ${TAG#v}"; exit 1; }
      - name: Publish
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --jq .html_url
