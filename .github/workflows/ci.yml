name: CI

# Runs on every pull request into main and on every push to main (each merge), plus by hand.
# No schedule: nothing changes between commits. Jobs are skipped when a change can't affect them
# (docs only, or no Rust changes), and the "CI passed" job is the single check that branch
# protection requires, so skipped jobs never block a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      rust: ${{ steps.rust.outputs.rust }}
      sweeps: ${{ steps.sweeps.outputs.sweeps }}
    # Pull requests only (the filter asks the API for the PR's files); other events test everything.
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: app
        with:
          # A file counts if it matches every pattern: anything except docs and Markdown.
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: rust
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
      # The widget and theme sweeps are slow; on pull requests they only run when something that
      # can change a widget's layout changed. Pushes to main always run them.
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: sweeps
        with:
          filters: |
            sweeps:
              - 'src/widgets/**'
              - 'src/theme/**'
              - 'src/canvas/**'
              - 'src/dev/**'
              - 'src/lib/**'
              - 'src/index.css'
              - 'src/dashboard/Grid.tsx'
              - 'src/dashboard/WidgetHost.tsx'
              - 'src/app/settle.ts'
              - 'mock-canvas/**'
              - 'scripts/widget-lab.ts'
              - 'scripts/theme-sweep.ts'
              - 'scripts/browser.ts'
              - 'tailwind.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  # The web checks are split into three jobs that run side by side: the quick static checks,
  # the UI check, and the widget sweeps (the slowest part), so the slowest decides the wall time.
  checks:
    name: Lint, types, unit tests, build
    needs: changes
    # Manual and main-branch runs always test everything.
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ui:
    name: UI check
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      # Starts its own mock Canvas and Vite server; no secrets or network needed.
      - run: pnpm test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ui
          path: screenshots/
          retention-days: 7

  widgets:
    name: Widget sweeps
    needs: changes
    if: needs.changes.outputs.sweeps == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Widget sweep (every widget, size and mock scenario)
        run: pnpm test:widgets
      # Again with a wide monospace font forced, so layouts never depend on one font's metrics.
      - name: Widget sweep with a wide fallback font
        run: pnpm test:widgets --scenario=dense --font="DejaVu Sans Mono"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-widgets
          path: screenshots/
          retention-days: 7

  # Every widget style gets the widget sweep too, one job per style so they run side by side.
  # Styles whose files (and the shared widget code) hash the same as their last pass are
  # skipped; each style's pass record lives in the Actions cache. The hash check needs only
  # Node, so a style with nothing to sweep finishes before installing anything. Keep the list
  # in step with src/theme/skins/index.ts (a unit test checks).
  themes:
    name: Theme sweep (${{ matrix.style }})
    needs: changes
    if: needs.changes.outputs.sweeps == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        style: [card, postit, index-card, terminal, pixel, swiss, blueprint, journal]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: .cache/theme-sweep.json
          key: theme-sweep-${{ matrix.style }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: theme-sweep-${{ matrix.style }}-
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Anything to sweep?
        id: todo
        shell: bash
        run: |
          node scripts/theme-sweep.ts --styles=${{ matrix.style }} --dry-run | tee todo.txt
          if grep -q '→ sweep' todo.txt; then echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.todo.outputs.needed == 'true'
        uses: ./.github/actions/setup-browser
      - if: steps.todo.outputs.needed == 'true'
        run: pnpm test:themes --styles=${{ matrix.style }}
      - if: always() && steps.todo.outputs.needed == 'true' && hashFiles('.cache/theme-sweep.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/theme-sweep.json
          key: theme-sweep-${{ matrix.style }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.style }}
          path: screenshots/
          retention-days: 7

  rust:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Tauri system packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config
          version: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p dist
      - run: cargo test --locked
        working-directory: src-tauri

  passed:
    name: CI passed
    needs: [changes, checks, ui, widgets, themes, rust]
    # Not when the run itself was cancelled (a newer push superseded it): that's not a failure,
    # and the newer run reports instead.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped as not affected
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
