name: CI

# Runs on every pull request into main and on every push to main (each merge), plus by hand.
# No schedule: nothing changes between commits. Jobs are skipped when a change can't affect them
# (docs only, or no Rust changes), and the "CI passed" job is the single check that branch
# protection requires, so skipped jobs never block a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      rust: ${{ steps.rust.outputs.rust }}
      sweeps: ${{ steps.sweeps.outputs.sweeps }}
      workflows: ${{ steps.workflows.outputs.workflows }}
    # Pull requests only (the filter asks the API for the PR's files); other events test everything.
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: app
        with:
          # A file counts if it matches every pattern: anything except docs, Markdown and the
          # release workflows (CI never runs them; the workflow lint below checks them).
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/workflows/release.yml'
              - '!.github/workflows/release-cache.yml'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: workflows
        with:
          filters: |
            workflows:
              - '.github/**'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: rust
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
      # The widget and theme sweeps are slow; on pull requests they only run when a changed file
      # can change what they render: anything the lab page imports (followed from its imports by
      # scripts/theme-sweep.ts, so the list never goes stale), a widget style, the mock data or
      # the sweep scripts. Pushes to main always run them.
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: files
        with:
          list-files: json
          filters: |
            any:
              - '**'
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          # Plain Node: no pnpm here, so don't look for its cache.
          package-manager-cache: false
      - name: Do the sweeps need to run?
        if: github.event_name == 'pull_request'
        id: sweeps
        env:
          CHANGED_FILES: ${{ steps.files.outputs.any_files }}
        run: echo "sweeps=$(node scripts/theme-sweep.ts --affected)" >> "$GITHUB_OUTPUT"

  # Seconds-long syntax and expression check of every workflow, whenever one changes.
  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # The web checks are split into three jobs that run side by side: the quick static checks,
  # the UI check, and the widget sweeps (the slowest part), so the slowest decides the wall time.
  checks:
    name: Lint, types, unit tests, build
    needs: changes
    # Manual and main-branch runs always test everything.
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ui:
    name: UI check
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      # Starts its own mock Canvas and Vite server; no secrets or network needed.
      - run: pnpm test:ui
      # The smallest window, dialogs by keyboard, a failing network (checks still waiting on a
      # fix report as pending and don't fail).
      - if: success() || failure()
        run: pnpm test:ui:passes
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ui
          path: screenshots/
          retention-days: 7

  widgets:
    name: Widget sweeps
    needs: changes
    if: needs.changes.outputs.sweeps == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-browser
      - name: Widget sweep (every widget, size and mock scenario)
        run: pnpm test:widgets
      # Again with a wide monospace font forced, so layouts never depend on one font's metrics.
      - name: Widget sweep with a wide fallback font
        run: pnpm test:widgets --scenario=dense --font="DejaVu Sans Mono"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-widgets
          path: screenshots/
          retention-days: 7

  # Every widget style gets the widget sweep too, one job per style so they run side by side.
  # Styles whose files (and the shared widget code) hash the same as their last pass are
  # skipped; each style's pass record lives in the Actions cache. The hash check needs only
  # Node, so a style with nothing to sweep finishes before installing anything. Keep the list
  # in step with src/theme/skins/index.ts (a unit test checks).
  themes:
    name: Theme sweep (${{ matrix.style }})
    needs: changes
    if: needs.changes.outputs.sweeps == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        style: [card, postit, index-card, terminal, pixel, swiss, blueprint, journal]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: .cache/theme-sweep.json
          key: theme-sweep-${{ matrix.style }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: theme-sweep-${{ matrix.style }}-
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Plain Node: no pnpm here, so don't look for its cache.
          package-manager-cache: false
      - name: Anything to sweep?
        id: todo
        shell: bash
        run: |
          node scripts/theme-sweep.ts --styles=${{ matrix.style }} --dry-run | tee todo.txt
          if grep -q '→ sweep' todo.txt; then echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.todo.outputs.needed == 'true'
        uses: ./.github/actions/setup-browser
      - if: steps.todo.outputs.needed == 'true'
        run: pnpm test:themes --styles=${{ matrix.style }}
      - if: always() && steps.todo.outputs.needed == 'true' && hashFiles('.cache/theme-sweep.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/theme-sweep.json
          key: theme-sweep-${{ matrix.style }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.style }}
          path: screenshots/
          retention-days: 7

  rust:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Tauri system packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config
          version: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Lists the files that need formatting as annotations, then fails.
      - name: rustfmt
        working-directory: src-tauri
        run: |
          if ! cargo fmt --check >/dev/null; then
            for f in $(cargo fmt --check --message-format short 2>/dev/null | sort -u); do
              echo "::warning file=src-tauri/${f#"$PWD/"}::not rustfmt-formatted (run cargo fmt)"
            done
            exit 1
          fi
      # generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p dist
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  # The macOS- and Windows-only code (cfg(target_os = ...)) otherwise first compiles in a release.
  # A type check only, no tests or bundles; cached per OS.
  rust-os:
    name: Rust check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Real-time scanning of every file cargo writes is a large share of a Windows build.
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        # Only a speed-up: never let it fail the check.
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist
        shell: bash
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

  passed:
    name: CI passed
    needs: [changes, workflows, checks, ui, widgets, themes, rust, rust-os]
    # Not when the run itself was cancelled (a newer push superseded it): that's not a failure,
    # and the newer run reports instead.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped as not affected
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
