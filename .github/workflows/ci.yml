name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, unit tests, widget sweep, UI check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for the browser checks
        run: pnpm exec playwright install --with-deps chromium
      # Both start their own mock Canvas and Vite server; no secrets or network needed.
      - run: pnpm test:widgets
      - run: pnpm test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p dist
      - run: cargo test --locked
        working-directory: src-tauri
